[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-energy-model"
version = "1.0.0"
description = "Greenhouse energy techno-economic optimization model"
authors = [{name = "Fionn Ó hAilín", email = "fionnohailin@gmail.com"}]
requires-python = ">=3.9"

dependencies = [
    "pandas>=2.0,<3.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "scipy>=1.7",
    "plotly>=5.0",
    "dash>=2.0",
    "dash-bootstrap-components>=1.0",
    "joblib>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["greenhouse_model"]

[project.scripts]
greenhouse-model = "greenhouse_model.MainScript:main"